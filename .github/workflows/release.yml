name: Release

# Publishing a GitHub Release (e.g. v1.0.0) compiles the Julia side of SID
# in both of its builds and attaches them to that release: the trimmed one,
# sid-trim-linux-x86_64.tar.gz, which the Dockerfile downloads so that Atlas
# never compiles Julia, and the ordinary one, sid-linux-x86_64.tar.gz, to
# fall back on.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check versions match this release
        run: |
          expected="ARG SID_VERSION=${GITHUB_REF_NAME}"
          if ! grep -qx "$expected" Dockerfile; then
            echo "::error::Dockerfile must contain '$expected' before releasing"
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          if [[ "$(head -n 1 VERSION | tr -d '[:space:]')" != "$expected" ]]; then
            echo "::error::VERSION must be '$expected' before releasing"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compile the trimmed build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: TRIM=1
          platforms: linux/amd64
          outputs: type=local,dest=dist/trim

      - name: Compile the ordinary build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=dist/julia

      - name: Package
        run: |
          tar -czf dist/sid-trim-linux-x86_64.tar.gz -C dist/trim sid
          tar -czf dist/sid-linux-x86_64.tar.gz -C dist/julia sid
          cd dist
          sha256sum sid-trim-linux-x86_64.tar.gz > sid-trim-linux-x86_64.tar.gz.sha256
          sha256sum sid-linux-x86_64.tar.gz > sid-linux-x86_64.tar.gz.sha256

      - name: Smoke test the images Atlas would build
        run: |
          dev/smoke.sh dist/sid-trim-linux-x86_64.tar.gz
          dev/smoke.sh dist/sid-linux-x86_64.tar.gz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/sid-trim-linux-x86_64.tar.gz \
            dist/sid-trim-linux-x86_64.tar.gz.sha256 \
            dist/sid-linux-x86_64.tar.gz \
            dist/sid-linux-x86_64.tar.gz.sha256 \
            --clobber
