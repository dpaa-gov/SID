name: Tests

# Runs on every push and pull request. SIDJ's tests need no database. The
# server's tests are run too: without ARDS they cover its configuration and,
# by loading the package, its precompile workload, which exercises every
# endpoint on made-up data. The tests that need ARDS, the comparison with the
# R SID and the browser test are run locally (see the README).

on:
  push:
  pull_request:

jobs:
  julia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2

      - name: SIDJ
        run: julia --project=SIDJ -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

      - name: Server
        run: julia --project=server -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  # The trimmed build refuses to compile anything it cannot show to be
  # complete, so compiling it is the test that the code can still be trimmed.
  # The image is then made and started as a release would, without a database.
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compile the trimmed build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.trim
          platforms: linux/amd64
          outputs: type=local,dest=dist

      - name: Start the image
        run: |
          tar -czf dist/sid-linux-x86_64.tar.gz -C dist sid
          docker build --build-arg BUNDLE=dist/sid-linux-x86_64.tar.gz -t sid:trim .
          docker run -d --name sid -p 3838:3838 -e DB_NAME=none -e DB_USER=none -e DB_PASS=none sid:trim
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3838/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3838/healthz
          curl -fsS http://127.0.0.1:3838/ | grep -q "<title>SID</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3838/api/estimate)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3838/api/nope)" = 404
          docker logs sid
